name: Collecte des flux

on:
  schedule:
    - cron: "5 * * * *"   # toutes les heures à hh:05 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter les flux
        run: python scripts/collect.py

      - name: Enregistrer les nouveaux articles
        run: |
          git config user.name "veille-cyber-bot"
          git config user.email "veille-cyber-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "collecte: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
