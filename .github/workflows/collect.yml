name: Collecte des flux

# Déclenchée par la routine Claude « Veille » : elle pousse un commit vide sur la branche
# `collecte` (scripts/trigger_collect.sh), puis attend le commit de collecte sur main avant
# de lancer la synthèse. Plus de cron GitHub : les exécutions planifiées sont souvent
# retardées ou abandonnées, les événements push ne le sont pas.
on:
  push:
    branches: [collecte]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter les flux
        run: python scripts/collect.py

      # Toujours un commit, même sans nouvel article : la routine attend celui qui porte
      # l'identifiant de sa demande (le commit poussé sur `collecte`).
      - name: Enregistrer les nouveaux articles
        env:
          DEMANDE: ${{ github.sha }}
        run: |
          git config user.name "veille-cyber-bot"
          git config user.email "veille-cyber-bot@users.noreply.github.com"
          git add data/
          git commit --allow-empty -m "collecte: $(date -u +'%Y-%m-%d %H:%M') UTC (demande ${DEMANDE:0:12})"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
